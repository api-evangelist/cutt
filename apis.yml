name: cutt
description: >-
  cutt (cutt.com) is a Chinese technology company surfaced from the published
  portfolio of Qiming Venture Partners and added to the API Evangelist network
  as an enrichment lead. As of the 2026-07-20 enrichment pass the company has no
  reachable public web presence: the cutt.com apex does not complete an HTTPS
  connection, www.cutt.com returns HTTP 404 for the site root and every probed
  path, and no developer, documentation, or API subdomain (api./developer./docs./
  dev./open.) resolves. One surviving subdomain, zhiyue.cutt.com, issues a 301
  redirect to api.zhiyueapp.cn — a live JSON API host fronted by an APISIX 3.4.1
  gateway that returns an empty 200 body and publishes no documentation. The
  zhiyueapp.cn domain is registered to 北京简网生活圈科技有限公司 (Beijing Jianwang
  Life Circle Technology Co., Ltd.), which appears to be the operating entity
  behind the cutt.com property. The cutt.com domain itself was created in 2003
  and remains registered through Alibaba Cloud Computing Ltd. (HiChina) with an
  April 2027 expiry, so the registration is maintained even though the public
  site is not being served. No OpenAPI, AsyncAPI, SDK, portal, changelog, status
  page, or /.well-known/ discovery document could be found on any reachable
  host. This profile therefore records probed infrastructure evidence only; it
  carries no fabricated API surface and should be revisited if the company
  restores a public developer presence.
